<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRACE Teacher Login</title>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                linear-gradient(
                    135deg,
                    #e0f2fe,
                    #f8fbff,
                    #ffffff
                );
            padding:20px;
        }

        .login-container{
            width:100%;
            max-width:900px;
            display:grid;
            grid-template-columns:1fr 1fr;
            background:white;
            border-radius:28px;
            overflow:hidden;
            box-shadow:
                0 20px 50px rgba(0,0,0,0.12);
        }

        .left{
            padding:50px 40px;
            color:white;
            background:
                linear-gradient(
                    135deg,
                    #0f4cdb,
                    #2563eb
                );
        }

        .left h1{
            font-size:48px;
            margin-bottom:10px;
        }

        .left h3{
            line-height:1.5;
            margin-bottom:25px;
        }

        .left p{
            line-height:1.7;
            opacity:.9;
        }

        .right{
            padding:50px 40px;
            display:flex;
            align-items:center;
        }

        .login-box{
            width:100%;
        }

        .login-box h2{
            color:#0f172a;
            margin-bottom:8px;
        }

        .welcome{
            color:#64748b;
            margin-bottom:30px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:7px;
            font-weight:600;
            color:#334155;
        }

        .input-group input{
            width:100%;
            padding:14px 16px;
            border:1px solid #cbd5e1;
            border-radius:12px;
            font-size:15px;
            outline:none;
        }

        .input-group input:focus{
            border-color:#2563eb;
            box-shadow:
                0 0 0 3px rgba(37,99,235,.1);
        }

        .login-btn{
            width:100%;
            border:none;
            padding:15px;
            border-radius:12px;
            background:
                linear-gradient(
                    135deg,
                    #0f4cdb,
                    #2563eb
                );
            color:white;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            margin-top:8px;
        }

        .login-btn:hover{
            transform:translateY(-1px);
        }

        .error{
            display:none;
            margin-top:18px;
            padding:12px;
            border-radius:10px;
            background:#fee2e2;
            color:#b91c1c;
            font-size:14px;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#2563eb;
            text-decoration:none;
        }

        @media(max-width:700px){

            .login-container{
                grid-template-columns:1fr;
            }

            .left{
                padding:35px 25px;
            }

            .right{
                padding:35px 25px;
            }

        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="left">

        <h1>TRACE</h1>

        <h3>
            Tracking Reading Assessment,
            Competency & Evaluation
        </h3>

        <p>
            Teacher Portal
        </p>

        <br>

        <p>
            Access your assigned classes,
            monitor student reading assessments
            and track progress.
        </p>

    </div>


    <div class="right">

        <div class="login-box">

            <h2>👩‍🏫 Teacher Login</h2>

            <p class="welcome">
                Login to view your assigned classes.
            </p>


            <form id="teacherLoginForm">

                <div class="input-group">

                    <label for="teacherId">
                        Teacher ID
                    </label>

                    <input
                        type="text"
                        id="teacherId"
                        placeholder="Enter Teacher ID"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="teacherPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="teacherPassword"
                        placeholder="Enter Password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >

                    Login to Teacher Portal

                </button>


            </form>


            <div
                id="loginError"
                class="error"
            ></div>


            <a
                href="../index.html"
                class="back"
            >

                ← Back to Home

            </a>

        </div>

    </div>

</div>


<script type="module">

import { db } from "../firebase/firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const form =
    document.getElementById(
        "teacherLoginForm"
    );


const errorBox =
    document.getElementById(
        "loginError"
    );


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const teacherId =
            document
                .getElementById("teacherId")
                .value
                .trim();


        const password =
            document
                .getElementById("teacherPassword")
                .value;


        errorBox.style.display =
            "none";


        try{

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "teachers"
                    )
                );


            let teacher = null;


            snapshot.forEach(
                teacherDoc => {

                    const data =
                        teacherDoc.data();


                    /*
                       Support teacherId or id
                       depending on how the
                       teacher was imported.
                    */

                    const storedId =
                        String(
                            data.teacherId ||
                            data.loginId ||
                            data.id ||
                            teacherDoc.id ||
                            ""
                        )
                        .trim();


                    if(
                        storedId ===
                        teacherId &&
                        String(
                            data.password ||
                            ""
                        ) ===
                        password
                    ){

                        teacher = {

                            id:
                                teacherDoc.id,

                            ...data

                        };

                    }

                }
            );


            if(!teacher){

                errorBox.innerText =
                    "❌ Invalid Teacher ID or Password.";

                errorBox.style.display =
                    "block";

                return;

            }


            /*
               Store ONLY the teacher identity.
            */

            localStorage.setItem(
    "traceTeacherId",
    teacherId
);

            localStorage.setItem(
                "traceTeacherLoginId",
                teacherId
            );


            localStorage.setItem(
                "traceTeacherName",
                teacher.name || ""
            );


           window.location.href =
    "teacher.html";

        }

        catch(error){

            console.error(
                "Teacher login error:",
                error
            );


            errorBox.innerText =
                "❌ Unable to login. Please try again.";

            errorBox.style.display =
                "block";

        }

    }
);

</script>

</body>

</html>
