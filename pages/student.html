<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - TRACE</title>

<style>

body{
font-family:Arial;
background:#eef5ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:white;
padding:40px;
border-radius:15px;
width:400px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Import Students</h2>

<input type="file" id="studentFile" accept=".xlsx">

<br><br>

<button id="importStudents">
Import Students
</button>

<div id="result"></div>

<input type="text" placeholder="Student ID">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>

</html>
