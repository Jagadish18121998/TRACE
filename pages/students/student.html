<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE Student Portal</title>

   <link rel="stylesheet" href="../../css/student.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">

        <div class="logo">
            <i class="fa-solid fa-book-open-reader fa-3x" style="color:#0f4cdb;"></i>
            <h1>TRACE</h1>
            <p>Student Reading Portal</p>
        </div>

        <div class="login-title">
            <h2>Student Login</h2>
            <p>Read • Practice • Improve</p>
        </div>

        <form id="studentLoginForm">

            <div class="form-group">
                <label>Login ID</label>
                <input type="text" id="studentId" placeholder="Enter Login ID">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="studentPassword" placeholder="Enter Password">
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="footer-text">
            Every Reader Matters ✨
        </div>

    </div>

    <script type="module" src="../../js/student/studentLogin.js"></script>
</body>
