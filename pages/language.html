<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Language | TRACE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#06b6d4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:900px;
background:white;
padding:50px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

h1{
color:#2563eb;
font-size:45px;
margin-bottom:15px;
}

p{
font-size:18px;
color:#666;
margin-bottom:40px;
}

.cards{
display:flex;
justify-content:center;
gap:40px;
}

.card{
width:280px;
padding:30px;
border-radius:20px;
background:#f5f9ff;
cursor:pointer;
transition:.3s;
border:3px solid transparent;
}

.card:hover{
transform:translateY(-10px);
border-color:#2563eb;
}

.card h2{
font-size:32px;
margin-bottom:15px;
}

.card p{
margin-bottom:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

<div class="container">

<h1>Select Reading Language</h1>

<p>Please choose the language for today's assessment.</p>

<div class="cards">

<div class="card">

<h2>📘 English</h2>

<p>Reading Assessment</p>

<button>Start</button>

</div>

<div class="card">

<h2>📙 हिन्दी</h2>

<p>पठन मूल्यांकन</p>

<button>शुरू करें</button>

</div>

</div>

</div>

</body>
</html>
