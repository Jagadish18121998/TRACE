<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRACE Login</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
background:#f3f7ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
}

.login-box{

width:400px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h2{

text-align:center;
margin-bottom:30px;
color:#1565c0;

}

input,select{

width:100%;
padding:15px;
margin:12px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}

button{

width:100%;
padding:15px;
background:#1565c0;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;

}

button:hover{

background:#0d47a1;

}

</style>

</head>

<body>

<div class="login-box">

<h2>TRACE Login</h2>

<select id="role">

<option value="">Select Login</option>

<option value="student">Student</option>

<option value="teacher">Teacher</option>

<option value="admin">Admin</option>

</select>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

</div>

<script type="module" src="../js/login.js"></script>

</body>
</html>
